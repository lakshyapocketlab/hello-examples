version: 2
updates:
  - package-ecosystem: npm
    directory: "/node/send-template"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/webhooks/node-express"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # express and its types must move together.
      express:
        patterns: ["express", "@types/express"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: "/go/send-template"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
