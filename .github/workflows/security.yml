name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 6 * * 3"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [node/send-template, webhooks/node-express]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Audit production dependencies (blocking)
        working-directory: ${{ matrix.example }}
        run: |
          # Examples carry no lockfile: resolve one without installing, then audit it.
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r python/send-text/requirements.txt

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
