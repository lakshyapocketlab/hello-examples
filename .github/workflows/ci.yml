name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [node/send-template, webhooks/node-express, smoke-test/node, message-types/node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install and type-check
        working-directory: ${{ matrix.example }}
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the published SDK and compile
        run: |
          python -m pip install -r python/send-text/requirements.txt
          python -c "import lakshyapocketlab_hello"
          python -m py_compile python/send-text/send_text.py
          python -m py_compile smoke-test/python/smoke_test.py
          python -m pip install -r message-types/python/requirements.txt
          python -m py_compile message-types/python/send.py

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [go/send-template, smoke-test/go, message-types/go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: gofmt and go vet
        working-directory: ${{ matrix.module }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
